<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Main Node & Wing Gradient -->
    <linearGradient id="cogni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Connection Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />

  <!-- Logo Mark (Centered Synapse Book) -->
  <g transform="translate(10, 10)">
    <!-- Connection Lines -->
    <line x1="22" y1="11" x2="9" y2="20" stroke="url(#line-grad)" stroke-width="2" opacity="0.7" />
    <line x1="22" y1="11" x2="35" y2="20" stroke="url(#line-grad)" stroke-width="2" opacity="0.7" />
    <line x1="22" y1="11" x2="22" y2="30" stroke="url(#line-grad)" stroke-width="2" opacity="0.7" />

    <!-- Left Book Page / Layer -->
    <path d="M 5 36 C 13 31, 22 30, 22 11 C 22 11, 11 13, 5 20 Z" fill="url(#cogni-grad)" opacity="0.5" />
    
    <!-- Right Book Page / Neural Wing -->
    <path d="M 39 36 C 31 31, 22 30, 22 11 C 22 11, 33 13, 39 20 Z" fill="url(#cogni-grad)" opacity="0.9" />

    <!-- Spine Axis -->
    <path d="M 22 11 L 22 37" stroke="url(#cogni-grad)" stroke-width="3" stroke-linecap="round" />

    <!-- Synapse Nodes -->
    <circle cx="22" cy="11" r="4.5" fill="#38BDF8" />
    <circle cx="9" cy="20" r="3.5" fill="#0EA5E9" />
    <circle cx="35" cy="20" r="3.5" fill="#10B981" />
    <circle cx="22" cy="30" r="3" fill="#34D399" />
  </g>
</svg>
