<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="cogni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Synapse Book Icon) -->
  <g transform="translate(10, 8)">
    <!-- Left Page / Layer -->
    <path d="M 6 32 C 14 28, 22 28, 22 10 C 22 10, 12 12, 6 18 Z" fill="url(#cogni-grad)" opacity="0.75" />
    
    <!-- Right Page / Neural Wing -->
    <path d="M 38 32 C 30 28, 22 28, 22 10 C 22 10, 32 12, 38 18 Z" fill="url(#cogni-grad)" />

    <!-- Central Neural Node / Node Connections -->
    <path d="M 22 10 L 22 38" stroke="url(#cogni-grad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Synapse Nodes -->
    <circle cx="22" cy="10" r="3.5" fill="#0EA5E9" />
    <circle cx="10" cy="18" r="2.5" fill="#38BDF8" />
    <circle cx="34" cy="18" r="2.5" fill="#10B981" />
    <circle cx="22" cy="26" r="2.5" fill="#818CF8" />

    <!-- Connection Lines -->
    <line x1="22" y1="10" x2="10" y2="18" stroke="#0EA5E9" stroke-width="1.5" opacity="0.6" />
    <line x1="22" y1="10" x2="34" y2="18" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Logotype Text -->
  <text x="62" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0F172A" letter-spacing="-0.5">
    Cogni<tspan fill="url(#cogni-grad)">Learn</tspan>
  </text>
  
  <!-- AI Badge -->
  <rect x="182" y="18" width="28" height="16" rx="4" fill="#0EA5E9" fill-opacity="0.1" />
  <text x="188" y="30" font-family="monospace" font-weight="700" font-size="10" fill="#0EA5E9">AI</text>
</svg>
